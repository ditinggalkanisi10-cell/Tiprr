crons:
  - name: reconcile-devnet
    description: "Reconciles pending devnet deposits and retries identical signed payout transactions"
    cron: "*/15 * * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/reconcile"
    method: POST
    enabled: true
